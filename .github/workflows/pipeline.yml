name: Local CI-CD Pipeline
 
on:
  push:
    branches: [master]
 
jobs:
  deploy:
    runs-on: self-hosted
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t omprakash13890/devops:${{ github.run_number }} .
          docker push omprakash13890/devops:${{ github.run_number }}
 
      - name: Terraform Init
        working-directory: infra
        run: terraform init
 
      - name: Terraform Validate
        working-directory: infra
        run: terraform validate
 
      # ✅ Terraform Plan
      # image_tag is already passed here
      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -var="image_tag=${{ github.run_number }}"
 
      # 🔴 FIX: image_tag was missing here
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -var="image_tag=${{ github.run_number }}"
 
      - name: Wait for Deployment
        run: kubectl rollout status deployment/devops-app
 
      - name: Verify Pods
        run: kubectl get pods -o wide
